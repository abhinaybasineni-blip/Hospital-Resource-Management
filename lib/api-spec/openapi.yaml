openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hospital operations, inventory, access, alerts, and analysis API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account authentication and profile
  - name: resources
    description: Hospital resource inventory
  - name: dashboard
    description: Resource summaries and history
  - name: alerts
    description: Resource alerts
  - name: ai
    description: Server-side resource analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a hospital manager account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to a hospital account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Signed out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /profile:
    get:
      operationId: getProfile
      tags: [auth]
      summary: Get the current user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateProfile
      tags: [auth]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
  /profile/password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get live hospital resource totals and risk indicators
      responses:
        "200":
          description: Live resource summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /resources/{resourceType}:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
    get:
      operationId: listResources
      tags: [resources]
      summary: Search, filter, sort, and paginate a resource collection
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: location
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: bloodGroup
          in: query
          schema: { type: string }
        - name: expiry
          in: query
          schema: { type: string, enum: [any, soon, expired] }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
        - name: sort
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Resource page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createResource
      tags: [resources]
      summary: Create a resource record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /resources/{resourceType}/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getResource
      tags: [resources]
      summary: Get one resource record
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteResource
      tags: [resources]
      summary: Archive a resource record
      responses:
        "204":
          description: Resource archived
        "404":
          $ref: "#/components/responses/NotFound"
  /resources/{resourceType}/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ResourceType"
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: restoreResource
      tags: [resources]
      summary: Restore an archived resource record
      responses:
        "200":
          description: Restored resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          $ref: "#/components/responses/NotFound"
  /history:
    get:
      operationId: listHistory
      tags: [dashboard]
      summary: Get the current hospital's resource audit timeline
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema:
            $ref: "#/components/schemas/ResourceType"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Resource history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Get current resource alerts
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
  /alerts/{id}/read:
    patch:
      operationId: markAlertRead
      tags: [alerts]
      summary: Mark an alert read or unread
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertReadInput"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          $ref: "#/components/responses/NotFound"
  /ai/analyze:
    post:
      operationId: runAiAnalysis
      tags: [ai]
      summary: Analyze current hospital resource risk using Gemini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Validated Gemini analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /ai/action-plan:
    post:
      operationId: createActionPlan
      tags: [ai]
      summary: Generate an action plan from current inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Validated resource action plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /ai/checklist:
    post:
      operationId: createChecklist
      tags: [ai]
      summary: Generate an operations checklist from current inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Validated operations checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /ai/history:
    get:
      operationId: listAiHistory
      tags: [ai]
      summary: Get previous AI analyses
      responses:
        "200":
          description: Previous analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
components:
  parameters:
    ResourceType:
      name: resourceType
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ResourceType"
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Record conflicts with existing data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]
    ResourceType:
      type: string
      enum: [icu-beds, oxygen, ventilators, medicines, blood]
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        hospitalName: { type: string }
        role: { type: string, enum: [ADMIN, HOSPITAL_MANAGER, STAFF] }
        phone: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, name, email, hospitalName, role, createdAt]
    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
      required: [user]
    RegisterInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 10, maxLength: 128 }
        hospitalName: { type: string, minLength: 2, maxLength: 160 }
      required: [name, email, password, hospitalName]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
      required: [email, password]
    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        hospitalName: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: ["string", "null"], maxLength: 40 }
        avatarUrl: { type: ["string", "null"], maxLength: 500 }
    PasswordChangeInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
      required: [currentPassword, newPassword]
    Resource:
      type: object
      properties:
        id: { type: string, format: uuid }
        resourceType: { $ref: "#/components/schemas/ResourceType" }
        data:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: ["string", "null"], format: date-time }
      required: [id, resourceType, data, createdAt, updatedAt]
    ResourceInput:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
      required: [data]
    ResourcePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
      required: [items, page, limit, total]
    ResourceCounts:
      type: object
      properties:
        total: { type: integer }
        available: { type: integer }
        inUse: { type: integer }
        critical: { type: integer }
        warning: { type: integer }
        expiring: { type: integer }
      required: [total, available, inUse, critical, warning, expiring]
    DashboardSummary:
      type: object
      properties:
        hospitalName: { type: string }
        resources:
          type: object
          properties:
            icuBeds: { $ref: "#/components/schemas/ResourceCounts" }
            oxygen: { $ref: "#/components/schemas/ResourceCounts" }
            ventilators: { $ref: "#/components/schemas/ResourceCounts" }
            medicines: { $ref: "#/components/schemas/ResourceCounts" }
            blood: { $ref: "#/components/schemas/ResourceCounts" }
          required: [icuBeds, oxygen, ventilators, medicines, blood]
        activeAlerts: { type: integer }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }
      required: [hospitalName, resources, activeAlerts, recentActivity]
    HistoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        resourceType: { $ref: "#/components/schemas/ResourceType" }
        resourceId: { type: string, format: uuid }
        actorName: { type: string }
        action: { type: string, enum: [CREATE, UPDATE, DELETE, ARCHIVE, RESTORE] }
        previousData: { type: ["object", "null"], additionalProperties: true }
        newData: { type: ["object", "null"], additionalProperties: true }
        createdAt: { type: string, format: date-time }
      required: [id, resourceType, resourceId, actorName, action, createdAt]
    HistoryPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/HistoryItem" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
      required: [items, page, limit, total]
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        resourceType: { $ref: "#/components/schemas/ResourceType" }
        resourceId: { type: string, format: uuid }
        severity: { type: string, enum: [INFO, WARNING, HIGH, CRITICAL] }
        title: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, resourceType, resourceId, severity, title, message, isRead, createdAt]
    AlertReadInput:
      type: object
      properties:
        isRead: { type: boolean }
      required: [isRead]
    AnalysisAction:
      type: object
      properties:
        priority: { type: string, enum: [HIGH, MEDIUM, LOW] }
        action: { type: string }
        reason: { type: string }
      required: [priority, action, reason]
    CriticalResource:
      type: object
      properties:
        resourceType: { type: string }
        reason: { type: string }
      required: [resourceType, reason]
    ChecklistItem:
      type: object
      properties:
        task: { type: string }
        priority: { type: string, enum: [HIGH, MEDIUM, LOW] }
        completed: { type: boolean }
      required: [task, priority, completed]
    Analysis:
      type: object
      properties:
        id: { type: string, format: uuid }
        summary: { type: string }
        riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        criticalResources:
          type: array
          items: { $ref: "#/components/schemas/CriticalResource" }
        recommendedActions:
          type: array
          items: { $ref: "#/components/schemas/AnalysisAction" }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/ChecklistItem" }
        createdAt: { type: string, format: date-time }
      required: [id, summary, riskLevel, criticalResources, recommendedActions, checklist, createdAt]
    AnalysisInput:
      type: object
      properties:
        focus: { type: string, maxLength: 500 }

